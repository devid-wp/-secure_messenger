name: secure-messenger

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secure_messenger}
      POSTGRES_USER: ${POSTGRES_USER:-secure_messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in the deployment environment}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the deployment environment}
    volumes:
      - redis-data:/data
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    cpus: 0.5

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the deployment environment}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the deployment environment}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the deployment environment}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks: [private]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15
    mem_limit: 1g
    cpus: 1.0

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the deployment environment}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the deployment environment}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the deployment environment}
    networks: [private]
    entrypoint:
      - /bin/sh
      - -ec
      - mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" && mc mb --ignore-existing "local/$$S3_BUCKET"

  migrate:
    build: .
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-secure_messenger}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-secure_messenger}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the HTTPS browser origin}
      TRUSTED_PROXY_CIDRS: 172.28.0.10/32
      MEDIA_STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the deployment environment}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the deployment environment}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the deployment environment}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - uploads-data:/app/uploads
    mem_limit: 512m
    cpus: 0.5

  backend:
    build: .
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 768m
    cpus: 1.0

  frontend:
    build: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.28.0.10
      edge: {}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN to the HTTPS browser origin}
    command:
      - /bin/sh
      - -ec
      - sed "s|__PUBLIC_ORIGIN__|$$PUBLIC_ORIGIN|g" /etc/prometheus/prometheus.yml.tmpl > /tmp/prometheus.yml && exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/config/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox.yml:/config/blackbox.yml:ro
    networks: [private, edge]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:?set ALERT_WEBHOOK_URL to the incident-management webhook}
    command:
      - /bin/sh
      - -ec
      - sed "s|__ALERT_WEBHOOK_URL__|$$ALERT_WEBHOOK_URL|g" /etc/alertmanager/alertmanager.yml.tmpl > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
    networks: [private, edge]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25

networks:
  private:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  edge: {}

volumes:
  postgres-data:
  redis-data:
  minio-data:
  uploads-data:
  prometheus-data:
