[package]
name = "secure-messenger-mls-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
openmls = "=0.8.1"
openmls_basic_credential = "=0.5.0"
openmls_rust_crypto = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tls_codec = "0.4"
wasm-bindgen = "=0.2.126"

[dev-dependencies]
wasm-bindgen-test = "0.3.76"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
