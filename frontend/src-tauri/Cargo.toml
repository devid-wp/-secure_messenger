[package]
name = "secure-messenger-desktop"
version = "0.1.0"
description = "Secure Messenger desktop cryptographic boundary"
authors = ["Secure Messenger contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "secure_messenger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
