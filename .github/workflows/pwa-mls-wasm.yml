name: PWA OpenMLS WASM

on:
  push:
    paths:
      - "frontend/src-wasm/**"
      - "frontend/src/crypto/**"
      - "frontend/src/App.jsx"
      - "frontend/public/service-worker.js"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/package*.json"
      - "frontend/scripts/build-mls-wasm.mjs"
      - ".github/workflows/pwa-mls-wasm.yml"
  pull_request:
    paths:
      - "frontend/src-wasm/**"
      - "frontend/src/crypto/**"
      - "frontend/src/App.jsx"
      - "frontend/public/service-worker.js"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/package*.json"
      - "frontend/scripts/build-mls-wasm.mjs"
      - ".github/workflows/pwa-mls-wasm.yml"

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-wasm
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Check formatting
        working-directory: frontend/src-wasm
        run: cargo fmt --check
      - name: Compile OpenMLS for WASM
        working-directory: frontend/src-wasm
        run: cargo check --locked --target wasm32-unknown-unknown
      - name: Build PWA
        working-directory: frontend
        run: npm ci && npm run build
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Audit npm dependency graph
        working-directory: frontend
        run: npm audit --audit-level=high
