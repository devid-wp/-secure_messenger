name: Release security gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Reject explicitly skipped security tests
        run: python scripts/check_no_skipped_security_tests.py
      - name: Install hash-pinned Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Verify migrations on a clean database
        run: DATABASE_URL=sqlite+aiosqlite:////tmp/secure-messenger-ci.db APP_ENV=test python -m alembic upgrade head
      - name: Run complete backend test suite
        id: backend_tests
        continue-on-error: true
        run: python -m pytest
      - name: Audit Python production dependencies
        id: pip_audit
        continue-on-error: true
        run: |
          mkdir -p audit-results
          python -m pip_audit -r requirements.lock --format json --output audit-results/pip-audit.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install lockfile-exact frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit complete npm dependency graph
        id: npm_audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high --json > ../audit-results/npm-audit.json
      - name: Lint, typecheck, and test frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test

      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-wasm
      - name: Install pinned audit and WASM tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Verify locked Rust dependency graph
        working-directory: frontend/src-wasm
        run: |
          cargo fmt --check
          cargo check --locked --target wasm32-unknown-unknown
          cargo test --locked
      - name: Audit Rust dependency graph
        id: cargo_audit
        continue-on-error: true
        working-directory: frontend/src-wasm
        run: cargo audit --json > ../../audit-results/cargo-audit.json

      - name: Build browser MLS application
        working-directory: frontend
        run: npm run build
      - name: Build production container images
        run: |
          docker build --tag secure-messenger-backend:ci .
          docker build --tag secure-messenger-frontend:ci frontend
      - name: Audit backend container image
        id: trivy_backend
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: secure-messenger-backend:ci
          format: json
          output: audit-results/trivy-backend.json
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Audit frontend container image
        id: trivy_frontend
        continue-on-error: true
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: secure-messenger-frontend:ci
          format: json
          output: audit-results/trivy-frontend.json
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Install supported Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2EE in supported Chromium
        working-directory: frontend
        run: npm run test:e2e -- --project=chromium

      - name: Verify dependency lockfiles stayed unchanged
        run: |
          git diff --exit-code -- \
            requirements.lock \
            requirements-dev.lock \
            frontend/package-lock.json \
            frontend/src-wasm/Cargo.lock

      - name: Preserve dependency audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-results
          path: audit-results/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce dependency audit policy
        if: steps.backend_tests.outcome == 'failure' || steps.pip_audit.outcome == 'failure' || steps.npm_audit.outcome == 'failure' || steps.cargo_audit.outcome == 'failure' || steps.trivy_backend.outcome == 'failure' || steps.trivy_frontend.outcome == 'failure'
        run: |
          echo "A test, dependency audit, or container audit failed. Critical and high findings block the release."
          exit 1

  staging-release-candidate:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated staging credentials
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 32)"
            echo "S3_ACCESS_KEY_ID=ci$(openssl rand -hex 12)"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 32)"
            echo "S3_BUCKET=secure-messenger-ci"
            echo "PUBLIC_ORIGIN=https://staging.invalid"
            echo "ALERT_WEBHOOK_URL=https://alerts.invalid/secure-messenger"
          } > .ci-staging.env
      - name: Start clean production-shaped staging stack
        run: docker compose --env-file .ci-staging.env up -d --build --wait --wait-timeout 240
      - name: Smoke test public surface and private metrics
        run: |
          curl --fail --show-error --retry 10 --retry-connrefused http://127.0.0.1:8080/
          curl --fail --show-error http://127.0.0.1:8080/api/v1/realtime/health
          docker compose --env-file .ci-staging.env exec -T backend python -c "import urllib.request; body = urllib.request.urlopen('http://localhost:8000/metrics').read(); assert b'secure_messenger_http_requests_total' in body"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run E2EE browser flow against staging stack
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e -- --project=chromium
      - name: Verify backup, restore, and migration rollback
        run: |
          export DEPLOY_ENV_FILE="$PWD/.ci-staging.env"
          export BACKUP_DIR="$RUNNER_TEMP/secure-messenger-backups"
          bash scripts/backup-production.sh
          export STAGING_ENV_FILE="$DEPLOY_ENV_FILE"
          export BACKUP_PATH="$(find "$BACKUP_DIR" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          export ROLLBACK_REVISION=20260807_21
          bash scripts/restore-staging.sh --confirm-staging-restore
      - name: Preserve staging diagnostics
        if: always()
        run: docker compose --env-file .ci-staging.env logs --no-color > staging-compose.log
      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-compose-diagnostics
          path: staging-compose.log
          retention-days: 14
      - name: Stop staging stack
        if: always()
        run: docker compose --env-file .ci-staging.env down --volumes --remove-orphans
