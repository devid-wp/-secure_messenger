name: Publish signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example 1.0.0)
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: secure-messenger-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-messenger-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/secure-messenger-frontend
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a semantic version and a green release gate for this commit
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(gh run list --workflow release-security.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq 'length')" -ge 1
          ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push signed-release backend image
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
      - name: Build and push signed-release frontend image
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.VERSION }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@v4.1.0
      - name: Sign immutable image digests with GitHub OIDC
        run: |
          cosign sign --yes "$BACKEND_IMAGE@${{ steps.backend.outputs.digest }}"
          cosign sign --yes "$FRONTEND_IMAGE@${{ steps.frontend.outputs.digest }}"
      - name: Publish GitHub provenance attestations
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - name: Publish frontend provenance attestation
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - name: Record image digests, create annotated tag, and publish release
        run: |
          {
            echo "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
            echo "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}"
          } > release-digests.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Secure Messenger v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" release-digests.txt --title "Secure Messenger v$VERSION" --generate-notes
